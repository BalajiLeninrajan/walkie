[package]
name = "walkie-dictate"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Push-to-talk dictation for Wayland, with nothing resident between dictations"
license = "MIT"
authors = ["Balaji Leninrajan"]

[[bin]]
name = "walkie"
path = "src/main.rs"

[dependencies]
libc = "0.2"
text2num = { version = "2.8", default-features = false, features = ["en", "std"] }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[build-dependencies]
cc = "1"
cmake = "0.1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
